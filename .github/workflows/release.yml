name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DRY RUN: Build without creating a release"
        type: boolean
        required: true
        default: false

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        ffmpeg: ["6", "8", "9"]
        target: [x86_64-unknown-linux-gnu]
    container:
      image: ${{ (matrix.ffmpeg == '8' || matrix.ffmpeg == '9') && 'debian:unstable' || null }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read release tag
        run: |
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            TAG="DEV"
          elif [ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="DEV"
          fi

          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Install prerequisites (FFmpeg 6 on Ubuntu)
        if: matrix.ffmpeg == '6'
        run: |
          sudo apt update
          sudo apt install -y \
            ffmpeg \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libavfilter-dev \
            libavdevice-dev \
            libswresample-dev \
            libswscale-dev \
            pkg-config \
            build-essential \
            clang \
            rustc \
            cargo \
            git

      - name: Install prerequisites (FFmpeg 8 on Debian Unstable)
        if: matrix.ffmpeg == '8'
        run: |
          apt update
          apt install -y \
            ffmpeg \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libavfilter-dev \
            libavdevice-dev \
            libswresample-dev \
            libswscale-dev \
            pkg-config \
            build-essential \
            clang \
            rustc \
            cargo \
            git

      - name: Install prerequisites (FFmpeg 9 on Debian Experimental)
        if: matrix.ffmpeg == '9'
        run: |
          apt-get update
          apt-get install -y apt-transport-https ca-certificates
          echo "deb http://deb.debian.org/debian experimental main" > /etc/apt/sources.list.d/experimental.list
          apt-get update
          apt-get install -y -t experimental \
            ffmpeg \
            libavcodec-dev \
            libavdevice-dev \
            libavfilter-dev \
            libavformat-dev \
            libavutil-dev \
            libswresample-dev \
            libswscale-dev \
            pkg-config \
            build-essential \
            clang \
            rustc \
            cargo \
            git

      - name: Verify Environment
        run: |
          ffmpeg -version
          pkg-config --modversion libavcodec

      - name: Build release
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Copy artifacts
        run: |
          mkdir -p "/tmp/artifacts"
          tar cvzf "/tmp/artifacts/audio-converter-$RELEASE_TAG-ffmpeg${{ matrix.ffmpeg }}-${{ matrix.target }}.tar.gz" \
              -C "./target/${{ matrix.target }}/release" "audio-converter" \
              -C "$(pwd)" "LICENSE.txt" "LICENSE.LGPL.txt"

      - name: Create GitHub Release
        if: ${{ inputs.dry_run == false }}
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          draft: true
          generateReleaseNotes: true
          artifacts: /tmp/artifacts/*

  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    strategy:
      matrix:
        target: [aarch64-apple-darwin]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read release tag
        run: |
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            TAG="DEV"
          elif [ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="DEV"
          fi

          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Install prerequisites
        run: |
          rustup target add ${{ matrix.target }}
          brew install ffmpeg pkg-config

      - name: Set PKG_CONFIG_PATH
        run: |
          echo "PKG_CONFIG_PATH=$(brew --prefix ffmpeg)/lib/pkgconfig" >> $GITHUB_ENV

      - name: Build release
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Copy artifacts
        run: |
          mkdir -p "/tmp/artifacts"
          tar cvzf "/tmp/artifacts/audio-converter-$RELEASE_TAG-${{ matrix.target }}.tar.gz" \
              -C "./target/${{ matrix.target }}/release" "audio-converter" \
              -C "$(pwd)" "LICENSE.txt" "LICENSE.LGPL.txt"

      - name: Create GitHub Release
        if: ${{ inputs.dry_run == false }}
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          draft: true
          generateReleaseNotes: true
          artifacts: /tmp/artifacts/*

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    strategy:
      matrix:
        target: [x86_64-pc-windows-msvc]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read release tag
        shell: bash
        run: |
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            TAG="DEV"
          elif [ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="DEV"
          fi

          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Install Rust target
        run: |
          rustup target add ${{ matrix.target }}

      - name: Download prebuilt FFmpeg libraries
        shell: pwsh
        run: |
          curl -L -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-lgpl-shared-9.0.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath temp_extract

          New-Item -ItemType Directory -Path ${{ github.workspace }}\ffmpeg -Force

          Move-Item -Path temp_extract\ffmpeg-n9.0-latest-win64-lgpl-shared-9.0\* -Destination ${{ github.workspace }}\ffmpeg
          Move-Item -Path temp_extract\ffmpeg-n9.0-latest-win64-lgpl-shared-9.0\.* -Destination ${{ github.workspace }}\ffmpeg -ErrorAction SilentlyContinue

          Remove-Item -Recurse -Force temp_extract

      - name: Build release
        env:
          FFMPEG_DIR: ${{ github.workspace }}\ffmpeg\
          FFMPEG_INCLUDE_DIR: ${{ github.workspace }}\ffmpeg\include
          FFMPEG_LIB_DIR: ${{ github.workspace }}\ffmpeg\lib
        run: cargo build --release --target ${{ matrix.target }}

      - name: Copy artifacts
        shell: pwsh
        working-directory: ./target
        run: |
          $outDir = "C:\tmp\artifacts"
          if (-Not (Test-Path $outDir)) { New-Item -ItemType Directory -Path $outDir }

          $zipFile = "$outDir\audio-converter-$env:RELEASE_TAG-${{ matrix.target }}.zip"

          $ffmpegDlls = Get-ChildItem "${{ github.workspace }}\ffmpeg\bin" -Filter "*.dll" | Select-Object -ExpandProperty FullName
          $licenseFiles = @("../LICENSE.txt", "../LICENSE.LGPL.txt")
          $files = @("./${{ matrix.target }}/release/audio-converter.exe") + $ffmpegDlls + $licenseFiles

          Compress-Archive -Path $files -DestinationPath $zipFile -Force

      - name: Create GitHub Release
        if: ${{ inputs.dry_run == false }}
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          draft: true
          generateReleaseNotes: true
          artifacts: C:/tmp/artifacts/*
